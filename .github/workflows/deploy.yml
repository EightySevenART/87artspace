# Publishes the site to GitHub Pages.
#  - Root (/):        the live site, or the "coming soon" page while site-mode.txt says "maintenance"
#  - /preview/:       always the current main branch (not indexed by search engines)
#  - /next/:          the branch "next" = the upcoming version, if it exists (not indexed).
#                      After pushing to "next", run this workflow manually (Actions > Deploy site > Run workflow).
name: Deploy site

on:
  push:
    branches: [main, maintenance]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: maintenance
          path: maintenance
      - name: Check out upcoming version (branch "next", optional)
        run: |
          git clone --depth 1 --branch next "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" next 2>/dev/null || echo "No branch next"
      - name: Assemble site
        run: |
          MODE=$(tr -d '[:space:]' < main/site-mode.txt 2>/dev/null || echo live)
          echo "Site mode: $MODE"
          mkdir -p out/preview
          if [ "$MODE" = "maintenance" ]; then cp -r maintenance/. out/; else cp -r main/. out/; fi
          cp -r main/. out/preview/
          if [ -d next ]; then mkdir -p out/next && cp -r next/. out/next/; fi
          rm -rf out/.git out/.github out/preview/.git out/preview/.github out/next/.git out/next/.github
          find out/preview -name '*.html' -exec sed -i 's#<head>#<head>\n<meta name="robots" content="noindex">#' {} +
          if [ -d out/next ]; then find out/next -name '*.html' -exec sed -i 's#<head>#<head>\n<meta name="robots" content="noindex">#' {} +; fi
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
